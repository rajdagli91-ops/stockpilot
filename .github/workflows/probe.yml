name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
                    UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          mkdir -p /tmp/fx
          curl -s -L -m 25 -A "$UA" "https://www.screener.in/company/GUJALKALI/" -o /tmp/fx/screener_gujalkali.html
          curl -s -L -m 25 -A "$UA" "https://www.screener.in/company/MCX/consolidated/" -o /tmp/fx/screener_mcx.html
          F=$(date -d "14 days ago" +%Y%m%d); T=$(date +%Y%m%d)
          curl -s -m 25 -A "$UA" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=Board%20Meeting&strPrevDate=$F&strScrip=&strSearch=P&strToDate=$T&strType=C&subcategory=-1" -o /tmp/fx/bse_board.json
          curl -s -m 25 -A "$UA" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=-1&strPrevDate=$F&strScrip=&strSearch=P&strToDate=$T&strType=C&subcategory=-1" -o /tmp/fx/bse_all.json
          ls -la /tmp/fx > /tmp/probe.txt
      - name: Save results
        if: always()
        run: |
          sleep 2; cd /tmp && mkdir pr && cd pr && git init -q && cp /tmp/probe.txt . && cp -r /tmp/fx . && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe
