name: Update scores

on:
  schedule:
    # GitHub's free schedules can start hours late or be skipped, especially on the hour. So each slot has
    # several tries at odd minutes; the first one that runs does the work, later ones see it is done and stop.
    - cron: "7 0 * * 1-5"    # 05:37 IST  Pre-market, try 1
    - cron: "41 0 * * 1-5"   # 06:11 IST  Pre-market, try 2
    - cron: "13 1 * * 1-5"   # 06:43 IST  Pre-market, try 3
    - cron: "47 1 * * 1-5"   # 07:17 IST  Pre-market, try 4
    - cron: "19 2 * * 1-5"   # 07:49 IST  Pre-market, try 5
    - cron: "23 6 * * 1-5"   # 11:53 IST  1 PM, try 1
    - cron: "53 6 * * 1-5"   # 12:23 IST  1 PM, try 2
    - cron: "21 7 * * 1-5"   # 12:51 IST  1 PM, try 3
    - cron: "17 8 * * 1-5"   # 13:47 IST  3 PM, try 1
    - cron: "49 8 * * 1-5"   # 14:19 IST  3 PM, try 2
    - cron: "19 9 * * 1-5"   # 14:49 IST  3 PM, try 3
  workflow_dispatch:
    inputs:
      mode:
        description: "portfolio = your stocks (~3 min), quick = your stocks + top candidates + today's news (~5 min), full = whole market (~45 min), symbols = only the symbols below"
        type: choice
        options: [portfolio, quick, full, symbols]
        default: portfolio
      symbols:
        description: "For mode=symbols: space-separated NSE symbols, e.g. INFY TCS"
        required: false
        default: ""
      slot:
        description: "Scheduled report this run stands in for (Pre-market, 1 PM, 3 PM); used by the outside alarm clock"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
      LOGIN_USER: ${{ secrets.LOGIN_USER }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: p
        run: |
          RUN=$(find . -path ./.git -prune -o -path '*/engine/run.py' -print | head -1)
          if [ -z "$RUN" ]; then
            echo "::error::Could not find engine/run.py in this repo. Upload all files from the zip (engine, docs, config folders, requirements.txt)."
            exit 1
          fi
          DIR=$(dirname "$(dirname "$RUN")")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: ${{ steps.p.outputs.dir }}

      - name: Load previous results (data branch)
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          mkdir -p docs/data config
          # the website saves your encrypted portfolios at the repo's top level
          if [ -f "$GITHUB_WORKSPACE/config/portfolios.enc.json" ] && [ "$(pwd)" != "$GITHUB_WORKSPACE" ]; then
            cp "$GITHUB_WORKSPACE/config/portfolios.enc.json" config/
          fi
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/prev
            cp -r /tmp/prev/. docs/data/ && rm -rf docs/data/.git
          fi

      - name: Choose mode
        id: m
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          SYMS: ${{ github.event.inputs.symbols }}
          MODE: ${{ github.event.inputs.mode }}
          INSLOT: ${{ github.event.inputs.slot }}
        run: |
          SYMS=$(printf '%s' "$SYMS" | tr -cd 'A-Za-z0-9&. -')
          case "$MODE" in full|quick|portfolio|symbols) ;; *) MODE=portfolio ;; esac
          SCHED="${{ github.event.schedule }}"
          SLOT=""; ARGS="$MODE $SYMS"
          case "$SCHED" in
            "7 0 * * 1-5"|"41 0 * * 1-5"|"13 1 * * 1-5"|"47 1 * * 1-5"|"19 2 * * 1-5") SLOT="Pre-market"; ARGS="full --slot Pre-market" ;;
            "23 6 * * 1-5"|"53 6 * * 1-5"|"21 7 * * 1-5") SLOT="1 PM"; ARGS="quick --slot '1 PM'" ;;
            "17 8 * * 1-5"|"49 8 * * 1-5"|"19 9 * * 1-5") SLOT="3 PM"; ARGS="quick --slot '3 PM'" ;;
          esac
          case "$INSLOT" in
            "Pre-market") SLOT="Pre-market"; ARGS="full --slot Pre-market" ;;
            "1 PM") SLOT="1 PM"; ARGS="quick --slot '1 PM'" ;;
            "3 PM") SLOT="3 PM"; ARGS="quick --slot '3 PM'" ;;
          esac
          SKIP=false
          if [ -n "$SLOT" ]; then
            TODAY=$(TZ=Asia/Kolkata date +%F)
            # a later slot that starts very late is pointless once the next one is due; the 1 PM run also covers 3 PM if late
            if python3 -c "import json,sys; d=json.load(open('docs/data/slots.json')); sys.exit(0 if sys.argv[2] in d.get(sys.argv[1], []) else 1)" "$TODAY" "$SLOT" 2>/dev/null; then
              SKIP=true; echo "$SLOT already ran today: nothing to do"
            fi
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Fetch data, score, report
        if: steps.m.outputs.skip != 'true'
        working-directory: ${{ steps.p.outputs.dir }}
        run: python -m engine.run ${{ steps.m.outputs.args }}

      - name: Save results (data branch, single commit, no history growth)
        if: steps.m.outputs.skip != 'true'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          cd docs/data
          git init -q && git checkout -q -b data
          git add -A
          git -c user.name=stockpilot-bot -c user.email=stockpilot-bot@users.noreply.github.com commit -qm "data $(date -u +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          rm -rf .git

      - name: Keep NSE list cache
        if: steps.m.outputs.skip != 'true'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          git add config/universe_cache.csv config/sectors.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git -c user.name=stockpilot-bot -c user.email=stockpilot-bot@users.noreply.github.com commit -qm "Update NSE stock and sector lists"
            git pull -q --rebase && git push -q || echo "cache push skipped"
          fi

      - name: Make browsers load the new site code (cache-busting)
        if: steps.m.outputs.skip != 'true'
        working-directory: ${{ steps.p.outputs.dir }}
        run: sed -i -E "s/(app\.js|style\.css)(\?v=[0-9]+)?\"/\1?v=${GITHUB_RUN_ID}\"/g" docs/index.html

      - uses: actions/configure-pages@v5
        if: steps.m.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.m.outputs.skip != 'true'
        with:
          path: ${{ steps.p.outputs.dir }}/docs
      - id: deploy
        if: steps.m.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
