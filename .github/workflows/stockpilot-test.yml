name: StockPilot research test
on:
  workflow_dispatch:
    inputs:
      script:
        description: "research script to run"
        default: "stockpilot_test.py"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -q -r stockpilot/requirements.txt scikit-learn
      - name: Run backtest
        env:
          SP_DIR: ${{ github.workspace }}/stockpilot
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          python ${{ github.workspace }}/stockpilot/research/${{ inputs.script || 'stockpilot_test.py' }} 2>&1 | tee sp_log.txt
      - name: Save results (research-sp branch)
        if: always()
        run: |
          cd /tmp/out
          git init -q && git checkout -q -b research-sp
          git add -A
          git -c user.name=stockpilot-bot -c user.email=stockpilot-bot@users.noreply.github.com commit -qm "stockpilot test $(date -u +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research-sp
